name: Deploy Fabric PROD

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Modo de despliegue"
        required: true
        default: "changed_all"
        type: choice
        options:
          - changed_all
          - changed_selected
          - all_allowed
          - all_selected
          - single

      artifact_types:
        description: "Para changed_selected o all_selected. Ejemplo: Report,SemanticModel"
        required: false
        type: string

      artifact_names:
        description: "Para single. Ejemplo: InformeDummy.Report,ModeloVentas.SemanticModel"
        required: false
        type: string

jobs:
  deploy-fabric-prod:
    name: Deploy Fabric PROD
    runs-on: ubuntu-latest
    environment: PROD

    permissions:
      contents: read

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Actualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar Fabric CICD
        run: |
          python -m pip install fabric-cicd==1.3.0

      - name: Validar sintaxis de deploy.py
        run: |
          python -m py_compile deploy.py

      - name: Mostrar configuración
        run: |
          echo "Modo: ${{ inputs.deployment_mode }}"
          echo "Tipos: ${{ inputs.artifact_types }}"
          echo "Elementos: ${{ inputs.artifact_names }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Ejecutar despliegue a PRO_Gold
        env:
          CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}

          TARGET_WORKSPACE_ID: ${{ secrets.FABRIC_PROD_WORKSPACE_ID }}
          TARGET_ENVIRONMENT: PROD

          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          ARTIFACT_TYPES: ${{ inputs.artifact_types }}
          ARTIFACT_NAMES: ${{ inputs.artifact_names }}

          GIT_COMPARE_REF: HEAD~1

        run: |
          python deploy.py
