name: Deploy Fabric PROD

on:
  workflow_dispatch:
    inputs:

      deployment_mode:
        description: "Modo de despliegue"
        required: true
        default: "changed_all"
        type: choice
        options:
          - changed_all
          - changed_selected
          - all_allowed
          - all_selected
          - single

      artifact_types:
        description: "Para changed_selected o all_selected. Tipos separados por comas. Ejemplo: Report,SemanticModel"
        required: false
        type: string

      artifact_names:
        description: "Solo para single. Elementos separados por comas. Ejemplo: InformeDummy.Report,ModeloSematicoAutoservicio_DirectLake.SemanticModel"
        required: false
        type: string


jobs:

  deploy-fabric-prod:

    name: Deploy Fabric PROD

    runs-on: ubuntu-latest

    environment: PROD

    permissions:
      contents: read

    steps:

      # ======================================================
      # Descargar repositorio
      # ======================================================

      - name: Checkout repositorio
        uses: actions/checkout@v5
        with:
          # Es necesario todo el historial para poder
          # comparar commits con get_changed_items.
          fetch-depth: 0


      # ======================================================
      # Configurar Python
      # ======================================================

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ======================================================
      # Instalar dependencias
      # ======================================================

      - name: Actualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar Fabric CICD
        run: |
          python -m pip install fabric-cicd==1.3.0


      # ======================================================
      # Mostrar información de ejecución
      # ======================================================

      - name: Mostrar configuración del despliegue
        run: |
          echo "Modo: ${{ inputs.deployment_mode }}"
          echo "Tipos: ${{ inputs.artifact_types }}"
          echo "Elementos: ${{ inputs.artifact_names }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"


      # ======================================================
      # Ejecutar despliegue
      # ======================================================

      - name: Ejecutar despliegue a PRO_Gold
        env:

          # --------------------------------------------------
          # Service Principal
          # --------------------------------------------------

          CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}


          # --------------------------------------------------
          # Workspace Fabric destino
          # --------------------------------------------------

          TARGET_WORKSPACE_ID: ${{ secrets.FABRIC_PROD_WORKSPACE_ID }}


          # --------------------------------------------------
          # Configuración del despliegue
          # --------------------------------------------------

          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}

          ARTIFACT_TYPES: ${{ inputs.artifact_types }}

          ARTIFACT_NAMES: ${{ inputs.artifact_names }}


          # --------------------------------------------------
          # Referencia para detección de cambios
          # --------------------------------------------------

          GIT_COMPARE_REF: HEAD~1


          # --------------------------------------------------
          # Entorno utilizado por parameter.yml
          # --------------------------------------------------

          TARGET_ENVIRONMENT: PROD

        run: |
          python deploy.py
