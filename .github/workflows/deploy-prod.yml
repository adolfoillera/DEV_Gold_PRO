name: Deploy Fabric PROD

on:
  workflow_dispatch:
    inputs:
      deployment_scope:
        description: "Selecciona el alcance del despliegue"
        required: true
        default: "changed_all"
        type: choice
        options:
          # Todos los elementos permitidos modificados
          - changed_all

          # Solo elementos modificados del tipo seleccionado
          - changed_reports
          - changed_semantic_models
          - changed_notebooks
          - changed_data_pipelines
          - changed_variable_libraries

          # Todos los elementos permitidos
          - all_allowed

          # Todos los elementos del tipo seleccionado
          - all_reports
          - all_semantic_models
          - all_notebooks
          - all_data_pipelines
          - all_variable_libraries

          # Un único elemento
          - single

      artifact_name:
        description: "Solo para single. Formato: Nombre.Tipo. Ejemplo: InformeDummy.Report"
        required: false
        type: string

jobs:
  deploy-fabric-prod:
    name: Deploy Fabric PROD
    runs-on: ubuntu-latest
    environment: PROD

    permissions:
      contents: read

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v5
        with:
          # Necesario para poder comparar el commit actual
          # con commits anteriores mediante get_changed_items.
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Actualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar Fabric CICD
        run: |
          python -m pip install fabric-cicd==1.3.0

      - name: Mostrar versión instalada
        run: |
          python -m pip show fabric-cicd

      - name: Mostrar configuración del despliegue
        run: |
          echo "Alcance seleccionado: ${{ inputs.deployment_scope }}"
          echo "Elemento individual: ${{ inputs.artifact_name }}"
          echo "Commit actual: ${{ github.sha }}"
          echo "Rama: ${{ github.ref_name }}"

      - name: Ejecutar despliegue a PRO_Gold
        env:
          # ==================================================
          # Autenticación Service Principal
          # ==================================================

          CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}

          # ==================================================
          # Workspace Fabric destino
          # ==================================================

          TARGET_WORKSPACE_ID: ${{ secrets.FABRIC_PROD_WORKSPACE_ID }}

          # ==================================================
          # Configuración del despliegue
          # ==================================================

          DEPLOYMENT_SCOPE: ${{ inputs.deployment_scope }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}

          # El despliegue changed compara el commit actual
          # con el commit inmediatamente anterior.
          GIT_COMPARE_REF: HEAD~1

          # Preparado para parameter.yml en el futuro.
          TARGET_ENVIRONMENT: PROD

        run: |
          python deploy.py
