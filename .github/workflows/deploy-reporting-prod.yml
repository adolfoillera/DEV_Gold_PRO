name: Deploy Reporting PROD

on:
  push:
    branches:
      - main

    paths:
      - "**/*.SemanticModel/**"
      - "**/*.Report/**"

jobs:

  deploy-reporting-prod:

    runs-on: ubuntu-latest

    environment: REPORTING_PRO

    permissions:
      contents: read

    steps:

      - name: Checkout repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Actualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar Fabric CICD
        run: |
          python -m pip install fabric-cicd==1.3.0

      - name: Ejecutar despliegue REPORTING_PRO
        env:

          CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}

          TARGET_WORKSPACE_ID: ${{ secrets.FABRIC_REPORTING_PRO_WORKSPACE_ID }}

          TARGET_ENVIRONMENT: REPORTING_PRO

          DEPLOYMENT_MODE: changed_selected

          ARTIFACT_TYPES: Report,SemanticModel

          ARTIFACT_NAMES:

          GIT_COMPARE_REF: HEAD~1

        run: |
          python deploy.py
